<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập | Hệ Thống Học Phần</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Pacifico&family=Playwrite+ZA:wght@100..400&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=League+Spartan:wght@100..900&family=Pacifico&family=Playwrite+ZA:wght@100..400&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
    <script src="js/login.js"></script>

</head>
<body>
    <div class="login-container">
        <div class="header-panel">
            <i class="fa-solid fa-graduation-cap"></i>
            <h1>HỆ THỐNG HỌC PHẦN</h1>
            <h2>TRƯỜNG ĐẠI HỌC A</h2>
        </div>

        <div class="form-panel">
            <form id="loginForm">

                <div class="form-group">
                    <label for="loginStudentId">MSSV</label>
                    <!--<input type="text" id="loginStudentId" name="StudentId" required>-->
                    <input type="text" id="studentId" name="StudentId" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <!--<input type="password" id="loginPassword" name="Password" required>-->
                    <input type="password" id="password" name="Password" required>
                </div>

                <!--<p id="loginResponseMessage" class="response-message"></p>-->
                <p id="errorMessage" class="response-message"></p>

                <button type="submit">ĐĂNG NHẬP</button>
                <!-- Thêm dưới nút Đăng nhập -->
                <div class="form-footer">
                    <a href="ForgotPassword.html" id="forgotPasswordLink">Quên mật khẩu?</a>
                </div>

            </form>

            <div class="form-footer">
                Bạn chưa có tài khoản? <a href="index.html">Đăng kí ngay.</a>
            </div>
        </div>
    </div>
</body>
</html>
