<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu</title>
    <style>
        :root {
            --primary-blue: #3f9ce3;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef1f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px; /* Giới hạn chiều rộng trên desktop */
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--primary-blue);
        }

        .form-group {
            margin-bottom: 15px;
        }

            .form-group label {
                display: block;
                margin-bottom: 5px;
                font-weight: 600;
                color: #555;
            }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 1em;
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1em;
            margin-top: 15px;
            transition: background 0.3s;
        }

            button:hover {
                background: #3486c4;
            }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Đặt lại mật khẩu</h2>
        <div class="form-group">
            <label for="newPassword">Mật khẩu mới</label>
            <input type="password" id="newPassword" placeholder="Nhập mật khẩu mới" required />
        </div>
        <div class="form-group">
            <label for="confirmPassword">Nhập lại mật khẩu</label>
            <input type="password" id="confirmPassword" placeholder="Xác nhận mật khẩu" required />
        </div>

        <button onclick="resetPassword()">Xác nhận</button>
        <p id="message"></p>
    </div>

    <script>
        // Hàm hiển thị thông báo thay cho alert()
        function showMessage(msg, isError = false) {
            const messageEl = document.getElementById("message");
            messageEl.textContent = msg;
            messageEl.style.color = isError ? 'red' : 'green';
        }

        async function resetPassword() {
            showMessage(''); // Xóa thông báo cũ
            const urlParams = new URLSearchParams(window.location.search);

            // 1. Lấy đủ 3 tham số từ URL
            const studentId = urlParams.get('studentId');
            const otp = urlParams.get('otp'); // <<< THAM SỐ QUAN TRỌNG ĐƯỢC THÊM VÀO

            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            // 2. Kiểm tra tính hợp lệ của tham số
            if (!studentId || !otp) {
                showMessage("Lỗi: Không tìm thấy MSSV hoặc Mã OTP. Vui lòng bắt đầu lại quy trình.", true);
                return;
            }

            // 3. Kiểm tra mật khẩu
            if (newPassword !== confirmPassword) {
                showMessage("Mật khẩu không trùng khớp", true);
                return;
            }
            if (newPassword.length < 6) {
                showMessage("Mật khẩu phải có ít nhất 6 ký tự", true);
                return;
            }

            showMessage("Đang xử lý...", false);

            try {
                // 4. Gọi API với ĐỦ 3 trường bắt buộc
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        studentId: studentId,
                        otp: otp, // <<< TRUYỀN OTP VÀO BODY REQUEST
                        newPassword: newPassword
                    })
                });

                const data = await res.json();

                if (data.success) {
                    showMessage(data.message + ". Đang chuyển hướng đến trang đăng nhập...", false);
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 2000);
                } else {
                    showMessage(data.message, true);
                }
            } catch (error) {
                showMessage("Lỗi kết nối mạng. Vui lòng thử lại.", true);
                console.error("Lỗi Reset Password API:", error);
            }
        }
    </script>
</body>
</html>
