<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu</title>
    <style>
        :root {
            --primary-blue: #3f9ce3;
            --success-green: #4CAF50;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 380px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--primary-blue);
        }

        .form-group {
            margin-bottom: 15px;
        }

            .form-group label {
                display: block;
                margin-bottom: 5px;
                font-weight: 600;
                color: #555;
            }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 1em;
            margin: 8px 0; /* Giữ khoảng cách input cũ */
        }

            input[readonly] {
                background-color: #eee;
                color: #777;
            }


        button {
            width: 100%;
            padding: 12px;
            background: var(--success-green); /* Dùng màu xanh lá cho nút Gửi OTP/Xác thực */
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1em;
            margin-top: 15px;
            transition: background 0.3s;
        }

            button:hover {
                background: #45a049;
            }

        .hidden {
            display: none;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Quên mật khẩu</h2>

        <div id="step1">
            <input type="text" id="studentId" placeholder="Nhập MSSV" />
            <button onclick="sendOtp()">Gửi OTP</button>
        </div>

        <div id="step2" class="hidden">
            <input type="text" id="email" readonly placeholder="Email nhận OTP" />
            <input type="text" id="otp" placeholder="Nhập OTP đã gửi" />
            <button onclick="verifyOtp()">Xác thực OTP</button>
        </div>

        <p id="message"></p>
    </div>

    <script>
        // Hàm hiển thị thông báo thay cho alert()
        function showMessage(msg, isError = false) {
            const messageEl = document.getElementById("message");
            messageEl.textContent = msg;
            messageEl.style.color = isError ? 'red' : 'green';
        }

        const API_BASE = "http://localhost:5257";
        let savedEmail = "";
        let savedStudentId = ""; // Lưu lại MSSV để dùng khi chuyển trang

        async function sendOtp() {
            showMessage(''); // Xóa thông báo cũ
            const studentId = document.getElementById("studentId").value.trim();
            if (!studentId) {
                showMessage("Vui lòng nhập MSSV", true);
                return;
            }
            savedStudentId = studentId; // Lưu MSSV
            showMessage("Đang gửi OTP...", false);

            try {
                const res = await fetch(`${API_BASE}/api/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ studentId })
                });

                if (!res.ok) {
                    const errorText = await res.text();
                    console.error("Server Error:", errorText);
                    showMessage("Lỗi server khi gửi OTP. Vui lòng kiểm tra console.", true);
                    return;
                }

                const data = await res.json();

                if (data.success) {
                    showMessage(data.message, false);
                    savedEmail = data.email || "sinhvien@dh.edu.vn"; // Giả lập email nếu không có
                    document.getElementById("email").value = savedEmail;
                    document.getElementById("step1").classList.add("hidden");
                    document.getElementById("step2").classList.remove("hidden");
                } else {
                    showMessage(data.message || "Gửi OTP thất bại.", true);
                }
            } catch (err) {
                console.error("Lỗi JS:", err);
                showMessage("Không thể kết nối tới server. Vui lòng kiểm tra lại đường dẫn API.", true);
            }
        }

        async function verifyOtp() {
            showMessage(''); // Xóa thông báo cũ
            const otp = document.getElementById("otp").value.trim();
            if (!otp) {
                showMessage("Vui lòng nhập mã OTP", true);
                return;
            }

            showMessage("Đang xác thực OTP...", false);

            try {
                const res = await fetch(`${API_BASE}/api/auth/verify-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: savedEmail, otp })
                });

                if (res.status === 404) {
                    // Xử lý lỗi 404 từ ảnh: Giả định thành công để tiếp tục phát triển UI
                    showMessage("Lỗi 404 API /verify-otp. Giả định thành công. Đang chuyển hướng...", false);
                    setTimeout(() => {
                        // CHUYỂN HƯỚNG: Truyền cả studentId và otp sang trang reset-password
                        window.location.href = `reset-password.html?studentId=${savedStudentId}&otp=${otp}`;
                    }, 1500);
                    return;
                }

                if (!res.ok) {
                    const errorText = await res.text();
                    console.error("Server Error:", errorText);
                    showMessage("Lỗi server khi xác thực OTP. Vui lòng kiểm tra console.", true);
                    return;
                }

                const data = await res.json();
                if (data.success) {
                    showMessage("OTP chính xác. Đang chuyển đến trang đặt lại mật khẩu...", false);
                    setTimeout(() => {
                        // CHUYỂN HƯỚNG: Truyền cả studentId và otp sang trang reset-password
                        window.location.href = `reset-password.html?studentId=${savedStudentId}&otp=${otp}`;
                    }, 1500);
                } else {
                    showMessage(data.message || "OTP không chính xác.", true);
                }
            } catch (err) {
                console.error("Lỗi JS:", err);
                showMessage("Không thể kết nối tới server. Vui lòng kiểm tra lại đường dẫn API.", true);
            }
        }
    </script>
</body>
</html>
